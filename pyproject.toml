[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banglabench"
version = "0.1.0"
description = "BanglaBayanno benchmark for VLM reliability evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
local = [
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.45",
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
  "qwen-vl-utils>=0.0.8",
]
api = [
  "openai>=1.40",
  "anthropic>=0.34",
  "google-genai>=1.0.0",
  "dashscope>=1.20",
  "python-dotenv>=1.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["banglabench*"]
