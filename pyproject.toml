[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banglabench"
version = "0.1.0"
description = "BanglaBayanno benchmark for VLM reliability evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
  "ollama>=0.4.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = [
  "ollama>=0.4.7",
]
api = [
  "python-dotenv>=1.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["banglabench*"]
